version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: financeapi
      DB_PASSWORD: financeapi123
      DB_NAME: financedb
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: financeapi
      POSTGRES_PASSWORD: financeapi123
      POSTGRES_DB: financedb
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: